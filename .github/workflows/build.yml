name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-qt6-tools
          mingw-w64-x86_64-SDL2

    - name: Configure CMake
      shell: msys2 {0}
      run: |
        cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

    - name: Build Release
      shell: msys2 {0}
      run: |
        cmake --build build --parallel

    - name: Package Artifacts
      shell: msys2 {0}
      run: |
        mkdir -p artifact
        cp build/FCGo.exe artifact/
        # Copy required DLLs
        ldd build/FCGo.exe | grep mingw | awk '{print $3}' | xargs -I{} cp {} artifact/ 2>/dev/null || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FCGo-Windows-x64
        path: artifact/
        retention-days: 30

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ ninja-build libsdl2-dev qt6-base-dev qt6-tools-dev

    - name: Configure CMake
      run: |
        cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build build --parallel

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FCGo-Linux-x64
        path: build/FCGo
        retention-days: 30
