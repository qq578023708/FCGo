name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-qt6-tools
          mingw-w64-x86_64-SDL2

    - name: Configure CMake
      shell: msys2 {0}
      run: |
        cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

    - name: Build Release
      shell: msys2 {0}
      run: |
        cmake --build build --parallel

    - name: Package Artifacts
      shell: msys2 {0}
      run: |
        mkdir -p artifact
        cp build/FCGo.exe artifact/
        # Copy required DLLs
        ldd build/FCGo.exe | grep mingw | awk '{print $3}' | xargs -I{} cp {} artifact/ 2>/dev/null || true
        # Copy steam_appid.txt if exists
        cp steam_appid.txt artifact/ 2>/dev/null || true
        # Create zip archive
        cd artifact && zip -r ../FCGo-Windows-x64.zip .

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: FCGo ${{ github.ref_name }}
        body: |
          ## FCGo ${{ github.ref_name }}

          ### Downloads
          - `FCGo-Windows-x64.zip` - Windows 64-bit portable build

          ### Changes
          See the full commit history for details.
        draft: false
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        files: FCGo-Windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
