name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
      
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.x'
        
    - name: Configure CMake
      run: |
        cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
        
    - name: Build Release
      run: |
        cmake --build build --config Release --parallel
        
    - name: Package Artifacts
      run: |
        mkdir -p artifact
        copy build\Release\FCGo.exe artifact\
        copy build\Release\*.dll artifact\ 2>nul || echo "No DLLs found"
        copy steam_appid.txt artifact\ 2>nul || echo "steam_appid.txt not found"
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FCGo-Windows-x64
        path: artifact/
        retention-days: 30
        
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libsdl2-dev qt6-base-dev qt6-tools-dev
        
    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
        
    - name: Build
      run: |
        cmake --build build --config Release --parallel
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FCGo-Linux-x64
        path: build/FCGo
        retention-days: 30
